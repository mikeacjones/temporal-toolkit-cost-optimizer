# Billing rules: which history events are billable Actions, and how many.
# Each rule cites the docs section it comes from. Detectors and the estimator
# read Action counts from here and never hard-code them.
#
# per: workflow_task   counts matching events once per Workflow Task
# actions_from         takes the count from a field on the event
# marker_names         limits a MARKER_RECORDED rule to these marker names
snapshot: 2026-10-15
rules:
  - event: EVENT_TYPE_WORKFLOW_EXECUTION_STARTED
    actions: 1
    source: cost/evaluate-cloud-actions#workflow
  - event: EVENT_TYPE_UPSERT_WORKFLOW_SEARCH_ATTRIBUTES
    actions: 1
    exclude_if: { search_attribute_only: TemporalChangeVersion }
    source: cost/evaluate-cloud-actions#workflow
  - event: EVENT_TYPE_WORKFLOW_EXECUTION_OPTIONS_UPDATED
    actions: 1
    source: cost/evaluate-cloud-actions#workflow
  - event: EVENT_TYPE_START_CHILD_WORKFLOW_EXECUTION_INITIATED
    actions: 2
    source: cost/evaluate-cloud-actions#workflow
  - event: EVENT_TYPE_ACTIVITY_TASK_SCHEDULED
    actions: 1
    source: cost/evaluate-cloud-actions#activity
  - event: EVENT_TYPE_ACTIVITY_TASK_STARTED
    actions_from: attempt_minus_one   # retries; the first attempt counts at SCHEDULED
    source: cost/evaluate-cloud-actions#activity
  - event: EVENT_TYPE_MARKER_RECORDED
    actions: 1
    per: workflow_task                # Local Activities in one Workflow Task count once
    marker_names: [LocalActivity, core_local_activity]   # version and Side Effect markers aren't billed
    source: cost/evaluate-cloud-actions#activity
  - event: EVENT_TYPE_WORKFLOW_TASK_COMPLETED
    actions_from: nonfirst_local_activity_execution_attempts
    source: cost/evaluate-cloud-actions#activity
  - event: EVENT_TYPE_TIMER_STARTED
    actions: 1
    source: cost/evaluate-cloud-actions#timer
  - event: EVENT_TYPE_WORKFLOW_EXECUTION_SIGNALED
    actions: 1
    source: cost/evaluate-cloud-actions#signal
  - event: EVENT_TYPE_SIGNAL_EXTERNAL_WORKFLOW_EXECUTION_INITIATED
    actions: 1
    source: cost/evaluate-cloud-actions#signal
  - event: EVENT_TYPE_WORKFLOW_EXECUTION_UPDATE_ACCEPTED
    actions: 1
    source: cost/evaluate-cloud-actions#update
  - event: EVENT_TYPE_NEXUS_OPERATION_SCHEDULED
    actions: 1
    source: cost/evaluate-cloud-actions#temporal-nexus
  - event: EVENT_TYPE_NEXUS_OPERATION_CANCEL_REQUESTED
    actions: 1
    source: cost/evaluate-cloud-actions#temporal-nexus
  - operation: signal_with_start
    actions: 1                        # one in total, whether or not it starts the Workflow
    source: cost/evaluate-cloud-actions#signal
not_in_history:
  - { operation: query, actions: 1, source: cost/evaluate-cloud-actions#query }
  - { operation: activity_heartbeat, actions: 1, note: "first call per attempt is sent at once; later calls throttled to 0.8 x HeartbeatTimeout" }
  - { operation: rejected_update, actions: 1, source: cost/evaluate-cloud-actions#update }
  - { operation: schedule_run, actions: 3, source: cost/evaluate-cloud-actions#schedule }
  - { operation: export, actions: 1, per: exported_workflow, source: cost/evaluate-cloud-actions#export }
  - { operation: workflow_task_heartbeat, actions: 1, note: "a Workflow Task that completes with no commands while a Local Activity runs", source: cost/evaluate-cloud-actions#activity }
namespace_multipliers:
  - { setting: replication, actions: 2.0, storage: 2.0, note: "the billable_action_count metric reports 1x" }
  - { setting: fairness, actions: 1.1, per: hour_enabled, source: cost/evaluate-cloud-actions#fairness }
  - { setting: provisioned_capacity, floor_actions_per_hour_per_extra_tru: 360000, source: cost/cloud-pricing }

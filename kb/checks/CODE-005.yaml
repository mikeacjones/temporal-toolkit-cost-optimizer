id: CODE-005
title: Schedule update that sets only cron expressions
confidence: medium
summary: >
  A Schedule update whose DoUpdate sets CronExpressions on the existing spec.
  The server turns cron expressions into calendar entries, so each such update
  appends duplicates to the spec and the Schedule's history grows.
match:
  call: schedule_update
  assigns: ["Spec.CronExpressions"]
  without_assigning: ["Spec", "Spec.Calendars"]
languages:
  go:
    status: implemented
    sdk_calls:
      schedule_update: ["go.temporal.io/sdk/client.ScheduleHandle.Update with ScheduleUpdateOptions.DoUpdate"]
  python:
    status: later
    sdk_calls: { schedule_update: ["ScheduleHandle.update"] }
  typescript:
    status: later
    sdk_calls: { schedule_update: ["ScheduleHandle.update"] }
  java:
    status: later
    sdk_calls: { schedule_update: ["ScheduleHandle.update"] }
facts:
  - claim: "Updating only cron expressions appends duplicate calendar entries to the spec"
    confirmed: true
    source: "Confirmed by the Schedules team; no public docs page yet"
  - claim: "Whether a Schedule update is billed as an Action"
    confirmed: false

id: CODE-003
title: Heartbeat settings that drive Heartbeat volume
confidence: medium
summary: >
  A short HeartbeatTimeout, or a Heartbeat as the first statement of an
  Activity. SDKs send the first Heartbeat of each attempt at once and throttle
  later ones to 0.8 times the HeartbeatTimeout, so a short timeout means more
  Heartbeats reach the server, and a Heartbeat at the start costs an Action on
  every run, even a fast one.
match:
  short_heartbeat_timeout: "ActivityOptions literal with HeartbeatTimeout set to a constant below the threshold"
  first_statement_heartbeat: "activity.RecordHeartbeat as the first statement of a function body"
parameters:
  heartbeat_timeout_threshold_seconds: 10
languages:
  go:
    status: implemented
    sdk_calls:
      activity_options: ["go.temporal.io/sdk/workflow.ActivityOptions.HeartbeatTimeout"]
      heartbeat: ["go.temporal.io/sdk/activity.RecordHeartbeat"]
    note: "Only constant durations, such as 5 * time.Second, are evaluated."
  python:
    status: later
    sdk_calls: { activity_options: ["heartbeat_timeout="], heartbeat: ["temporalio.activity.heartbeat"] }
  typescript:
    status: later
    sdk_calls: { activity_options: ["heartbeatTimeout"], heartbeat: ["Context.current().heartbeat", "heartbeat()"] }
  java:
    status: later
    sdk_calls: { activity_options: ["ActivityOptions.Builder.setHeartbeatTimeout"], heartbeat: ["Activity.getExecutionContext().heartbeat"] }
facts:
  - claim: "Every SDK sends an Activity's first Heartbeat immediately; later ones are throttled to 0.8 x HeartbeatTimeout"
    confirmed: true
    source: cost/evaluate-cloud-actions#activity
